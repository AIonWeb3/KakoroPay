name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p mcp-server --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r policy-generator/requirements.txt -r demo/requirements.txt
      - name: Ruff
        run: ruff check policy-generator demo tests scripts
      - name: Tests
        run: pytest -q

  payer:
    name: TypeScript Payer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: payer
        run: npm ci
      - name: Lint & Typecheck
        working-directory: payer
        run: |
          npm run lint
          npm run typecheck
      - name: Unit Tests
        working-directory: payer
        run: npm test
